<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&family=Merienda:wght@300..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link href="css/fonts.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <script src="javascript/notification.js"></script>
    <script src="javascript/api.js"></script>
    <script src="javascript/create_post_init.js"></script>
  </head>
  <body>
    <div class="page-container">
      <header>
        <nav id="navbar" class="navbar">
          <div id="navbar-button-container">
            <button id="menu-button" onclick="toggleNav(event)">Menu</button>
            <div aria-roledescription="title" class="title">Site</div>
          </div>

          <ul id="nav-list" class="hidden">
            <li><a href="all_posts.html">All Posts</a></li>
            <li><a href="create_post.html">New Post</a></li>
            <li><a href="bookmarked_posts.html">Saved Posts</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="login.html">Login</a></li>
          </ul>
        </nav>
      </header>
      <h2 class="centered-text">Create a Post</h2>
      <main>
        <form id="create-post-form" method="post" onsubmit="handlePostCreation(event)">
          <label for="content">Post Content</label>
          <textarea id="content" name="content" placeholder="Text content goes here..."></textarea>
          <input type="submit" value="Submit your post" />
        </form>
        <div id="notification"></div>
      </main>
      <footer>
        <h2>Site</h2>
        <ul id="footer-nav-list">
          <li><a href="all_posts.html">All Posts</a></li>
          <li><a href="create_post.html">New Post</a></li>
          <li><a href="bookmarked_posts.html">Saved Posts</a></li>
          <li><a href="register.html">Register</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
        <span id="copyright-note">All Rights Reserved. Site</span>
      </footer>
    </div>
  </body>
</html>
